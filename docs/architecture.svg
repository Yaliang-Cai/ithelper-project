<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" viewBox="0 0 1040 490" role="img" aria-labelledby="title desc"><title id="title">Employee IT Agent runtime and separate evaluation</title><desc id="desc">Employee authentication leads to persisted events, worker, single Agent and guarded effects. Approval resumes through events. Context loads five sources. Evaluation drives runtime but its oracle stays outside.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#326599"/></marker></defs><rect width="1040" height="490" rx="16" fill="#f5f8fc"/><g fill="#fff" stroke="#809bb8" stroke-width="2"><rect x="25" y="38" width="170" height="72" rx="10"/><rect x="240" y="38" width="200" height="72" rx="10"/><rect x="490" y="38" width="180" height="72" rx="10"/><rect x="725" y="38" width="285" height="72" rx="10"/><rect x="725" y="180" width="285" height="90" rx="10"/><rect x="395" y="180" width="270" height="90" rx="10"/><rect x="25" y="180" width="305" height="90" rx="10"/><rect x="240" y="337" width="425" height="92" rx="10"/><rect x="725" y="337" width="285" height="92" rx="10"/></g><g font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#17334e" text-anchor="middle"><text x="110" y="68">Employee / Auth</text><text x="110" y="94">员工聊天 / 身份</text><text x="340" y="68">SQLite messages/events</text><text x="340" y="94">持久事件与原文</text><text x="580" y="68">Worker</text><text x="580" y="94">租约 / 恢复</text><text x="867" y="68">Single business Agent</text><text x="867" y="94">整理 → 决策循环</text><text x="867" y="208">Guarded effects / acceptance</text><text x="867" y="233">身份 / 精确范围 / 版本 / 租约</text><text x="867" y="257">模拟写入 + 真实收据 / 交接</text><text x="530" y="211">Context + five sources</text><text x="530" y="238">KB / 历史 / 目录 / 政策 / 状态</text><text x="177" y="212">Approver / employee confirmation</text><text x="177" y="240">精确审批 / 影响确认 → 原问题恢复</text><text x="452" y="368">Evaluation outside runtime</text><text x="452" y="395">隔离世界 / 用户模拟 / oracle / grader</text><text x="452" y="419" font-size="14">oracle不进入Agent；不属于多个业务Agent</text><text x="867" y="371">Synthetic enterprise state</text><text x="867" y="399">实际程序逻辑，非真实企业连接</text></g><g fill="none" stroke="#326599" stroke-width="2" marker-end="url(#arrow)"><path d="M195 74H240"/><path d="M440 74H490"/><path d="M670 74H725"/><path d="M867 110V180"/><path d="M665 212H690V92H725"/><path d="M725 248H665"/><path d="M725 225H690V293H177V270"/><path d="M177 180V135H340V110"/><path d="M867 270V337"/><path d="M725 384H690V247H665"/><path d="M335 337H110V110" stroke-dasharray="7 5"/></g></svg>