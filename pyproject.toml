[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-it-helpdesk"
version = "0.1.4"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2", "pydantic>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "argon2-cffi>=23", "numpy>=2,<3", "bm25s>=0.2,<1", "jieba>=0.42"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
